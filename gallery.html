<!doctype html>
<html lang="en" data-page="gallery">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
<div class="wrap">
  <header id="nav"></header>

  <section class="head">
    <h1 class="page-title">Our favourite moments</h1>
    <p class="sub">Tap a photo to see it bigger.</p>
  </section>

  <!--
    HOW TO ADD YOUR PHOTOS
    1. Put six pictures in the "images" folder and name them photo1.jpg ... photo6.jpg
       (if yours are .png or .jpeg, change the file name in the matching <img src="..."> below).
    2. Change the caption text under each photo if you like.
    Until a photo is added, the frame shows a cute placeholder.
  -->
  <section class="photos">
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="paw"></span>Add photo 1</span><img src="images/photo1.jpeg" alt="Gulu and me, photo 1" onerror="this.style.display='none'"></div>
      <figcaption>Us, always</figcaption>
    </figure>
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="heart"></span>Add photo 2</span><img src="images/photo2.jpeg" alt="Gulu and me, photo 2" onerror="this.style.display='none'"></div>
      <figcaption>My favourite smile</figcaption>
    </figure>
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="star"></span>Add photo 3</span><img src="images/photo3.jpeg" alt="Gulu and me, photo 3" onerror="this.style.display='none'"></div>
      <figcaption>Happy day</figcaption>
    </figure>
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="cat"></span>Add photo 4</span><img src="images/photo4.jpeg" alt="Gulu and me, photo 4" onerror="this.style.display='none'"></div>
      <figcaption>Just us two</figcaption>
    </figure>
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="dog"></span>Add photo 5</span><img src="images/photo5.jpeg" alt="Gulu and me, photo 5" onerror="this.style.display='none'"></div>
      <figcaption>So much love</figcaption>
    </figure>
    <figure class="polaroid">
      <div class="shot"><span class="ph"><span class="sticker" data-s="bow"></span>Add photo 6</span><img src="images/photo6.jpeg" alt="Gulu and me, photo 6" onerror="this.style.display='none'"></div>
      <figcaption>My princess</figcaption>
    </figure>
  </section>

  <p class="center"><a class="btn" href="favourites.html">Gulu's favourites</a></p>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Enlarged photo"><img alt=""></div>
</body>
</html>
