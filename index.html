<!doctype html>
<html lang="en" data-page="gate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for my princess Gulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
<main class="wrap gate">
  <div class="card" id="gate-card">
    <div style="display:flex;gap:8px;align-items:flex-end">
      <span class="sticker bob" data-s="cat"></span>
      <span class="sticker lg wiggle" data-s="crown"></span>
      <span class="sticker bob delay2" data-s="dog"></span>
    </div>
    <h1 class="title">for my princess Gulu</h1>
    <p class="sub">Abhipsa, I made something special just for you.</p>
    <form id="gate-form" autocomplete="off" style="display:grid;gap:12px;justify-items:center;width:100%">
      <label for="pw">Enter password for your surprise</label>
      <input id="pw" type="password" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="off" aria-describedby="msg">
      <button class="btn" type="submit">Unlock</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="hint" id="hint" hidden>Hint: the day you said that you too love me the first time</p>
    <p class="small">6 digits, made with love.</p>
  </div>
</main>
</body>
</html>
